<!-- ============================================================ -->
<!-- PANEL LATERAL OSCURO: SALAS DE ENSAYO                       -->
<!-- ============================================================ -->
<div class="flex flex-col h-full justify-between space-y-3 lg:space-y-4">
    <div id="recientes" x-data="{ open: true }" class="pt-3 mt-2">
        <button type="button" @click="open = !open"
            class="w-full flex items-center justify-between cursor-pointer group text-left focus:outline-none pb-4">
            <h2
                class="text-lg font-black text-slate-100 group-hover:text-blue-300 transition-colors tracking-tight flex items-center gap-2 uppercase">
                <span>Mis proyectos</span>
                <img src="/assets/img/icons/dropdown-arrow.svg" alt=""
                    class="w-4 h-4 transition-transform duration-200 filter invert opacity-60"
                    :class="open ? 'rotate-0' : '-rotate-90'">
            </h2>
        </button>

        <div x-show="open" x-transition.duration.200ms class="space-y-2.5">
            {% if user_sessions %}
            {% for u_session in user_sessions %}
            <a href="/practice?session={{ u_session.session_id }}" title="Abrir sala: {{ u_session.original_filename }}"
                class="group relative flex items-stretch rounded-2xl bg-[#192847] hover:bg-[#20335A] border border-blue-400/40 hover:border-blue-300/65 shadow-[0_1px_0_rgba(147,197,253,0.14)] hover:shadow-[0_4px_14px_rgba(96,165,250,0.12)] transition-all duration-200 overflow-hidden min-h-[112px] lg:min-h-[115px] w-full shrink-0 hover:-translate-y-0.5">

                <!-- Portada de sesión propia: fondo sólido azul-índigo con ondas de audio sutiles -->
                <div
                    class="relative w-20 sm:w-24 shrink-0 overflow-hidden bg-blue-600 border-r border-blue-400/35">
                    <!-- Patrón de ondas decorativo -->
                    <div class="absolute inset-0 opacity-20">
                        <svg viewBox="0 0 80 96" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
                            <path d="M0 48 Q10 32 20 48 Q30 64 40 48 Q50 32 60 48 Q70 64 80 48" fill="none"
                                stroke="currentColor" stroke-width="1.5" class="text-blue-200" />
                            <path d="M0 36 Q10 24 20 36 Q30 48 40 36 Q50 24 60 36 Q70 48 80 36" fill="none"
                                stroke="currentColor" stroke-width="1" class="text-blue-200" />
                            <path d="M0 60 Q10 48 20 60 Q30 72 40 60 Q50 48 60 60 Q70 72 80 60" fill="none"
                                stroke="currentColor" stroke-width="1" class="text-blue-200" />
                        </svg>
                    </div>
                    <!-- Icono centrado -->
                    <div class="relative w-full h-full flex flex-col items-center justify-center gap-1.5">
                        <div
                            class="w-12 h-12 rounded-full bg-blue-500/50 border border-white flex items-center justify-center group-hover:scale-105 group-hover:border-blue-300/65 transition-all duration-300">
                            <svg class="w-8 h-8 text-blue-200" fill="none" stroke="currentColor" stroke-width="1.8"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                            </svg>
                        </div>                        
                    </div>
                </div>

                <!-- Contenido -->
                <div class="p-2.5 sm:p-3 flex-1 min-w-0 flex flex-col justify-between bg-[#192847] group-hover:bg-[#20335A] transition-colors">
                    <div class="min-w-0">
                        <h3
                            class="text-lg font-bold text-slate-50 group-hover:text-blue-200 transition-colors leading-snug truncate">
                            {{ u_session.original_filename.rsplit('.', 1)[0] | replace('_', ' ') | title }}
                        </h3>
                    </div>
                    <div class="flex items-center justify-end mt-1.5">
                        <div
                            class="w-7 h-7 rounded-full bg-blue-600 group-hover:bg-blue-500/35 border border-blue-300/35 group-hover:border-blue-300/60 text-blue-200 group-hover:text-white flex items-center justify-center shrink-0 group-hover:scale-105 transition-all duration-200">
                            <svg class="w-3 h-3 fill-current ml-0.5" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                        </div>
                    </div>
                </div>
            </a>
            {% endfor %}

            {% else %}
            <div class="p-4 rounded-xl bg-[#192847]/85 border border-dashed border-blue-400/35 shadow-[0_1px_0_rgba(147,197,253,0.12)] text-center">
                <div class="w-8 h-8 rounded-lg bg-[#20335A] border border-blue-400/25 flex items-center justify-center mx-auto mb-2">
                    <svg class="w-4 h-4 text-blue-300/80" fill="none" stroke="currentColor" stroke-width="1.8"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                    </svg>
                </div>
                <p class="text-xs text-slate-200 font-medium">No tienes salas personalizadas aún.</p>
                <p class="text-[11px] text-slate-400 mt-0.5">Sube una canción para verla aquí</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>

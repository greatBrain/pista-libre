<!-- Zona de Carga de Archivo (Dropzone de Estudio a Ancho Completo con Alpine.js) -->
<div class="w-full space-y-2.5">
    <!-- Contenedor Principal Dropzone / Tarjeta de Archivo Activo con Fondo Tonal y Borde Calibrado -->
    <div @dragover.prevent="handleDragOver($event)" @dragenter.prevent="handleDragOver($event)"
        @dragleave.prevent="handleDragLeave($event)" @drop.prevent="handleDrop($event)"
        @click="if (!selectedFile) triggerBrowse()" :class="{
            'border-blue-500 bg-blue-100/75 ring-4 ring-blue-200/60 scale-[1.004]': isDragging,
            'border-blue-300/90 bg-blue-50/70 shadow-xs': selectedFile && !isDragging,
            'border-slate-300 hover:border-blue-500 bg-[#E6ECF5] hover:bg-blue-50/75 cursor-pointer shadow-2xs hover:shadow-sm': !selectedFile && !isDragging
        }"
        class="w-full border-2 border-dashed rounded-2xl py-8 sm:py-9 lg:py-10 px-6 sm:px-8 text-center transition-all duration-200 group flex flex-col items-center justify-center gap-4 min-h-[240px] sm:min-h-[260px] lg:min-h-[280px]">

        <!-- Input Nativo Oculto (Disparado programáticamente vía $refs.fileInput) -->
        <input type="file" x-ref="fileInput" @change="handleFileSelect($event)" accept=".mp3,.wav,.flac,.aac,.m4a,.ogg"
            class="hidden" id="audio-file-input">

        <!-- ======================================================== -->
        <!-- ESTADO A: ZONA VACÍA (Sin archivo seleccionado)          -->
        <!-- ======================================================== -->
        <template x-if="!selectedFile">
            <div class="flex flex-col items-center justify-center gap-3.5 sm:gap-4 w-full max-w-2xl">
                <!-- Icono de Archivo de Música con contenedor moderno -->
                <div
                    class="w-18 h-18 sm:w-20 sm:h-20 rounded-xl bg-white border border-slate-300/80 group-hover:border-blue-400/70 flex items-center justify-center p-3.5 sm:p-4 transition-transform duration-200 group-hover:scale-105 shadow-2xs">
                    <img src="/assets/img/icons/music-file.svg" alt="Archivo de música"
                        class="w-full h-full object-contain">
                </div>

                <!-- Textos de Acción -->
                <div class="space-y-1.5">
                    <p class="text-2xl sm:text-3xl font-bold text-slate-900 leading-tight">
                        <span x-show="!isDragging">Arrastra aquí tu archivo</span>
                        <span x-show="isDragging" class="text-blue-600 font-extrabold">¡Suéltalo!</span>
                    </p>
                    <p class="text-sm sm:text-base text-slate-600" x-show="!isDragging">
                        o <button type="button" @click.stop="triggerBrowse()"
                            class="text-blue-600 underline font-bold hover:text-blue-700 cursor-pointer inline focus:outline-none underline-offset-4">Explora
                            en tu equipo</button>
                    </p>
                    <p class="text-sm sm:text-base text-blue-600 font-medium" x-show="isDragging">
                        Detectamos tu archivo, suéltalo para cargarlo
                    </p>
                </div>

                <!-- Formatos Permitidos y Límite de Peso -->
                <div class="flex flex-wrap items-center justify-center gap-2 text-xs sm:text-sm pt-1">
                    <span
                        class="px-2.5 py-1 rounded-md bg-white font-mono font-bold text-slate-700 border border-slate-300/80 shadow-2xs">MP3</span>
                    <span
                        class="px-2.5 py-1 rounded-md bg-white font-mono font-bold text-slate-700 border border-slate-300/80 shadow-2xs">WAV</span>
                    <span
                        class="px-2.5 py-1 rounded-md bg-white font-mono font-bold text-slate-700 border border-slate-300/80 shadow-2xs">FLAC</span>
                    <span
                        class="px-2.5 py-1 rounded-md bg-white font-mono font-bold text-slate-700 border border-slate-300/80 shadow-2xs">AAC</span>
                    <span class="text-slate-600 text-xs sm:text-sm pl-1 font-medium">• Máximo 10MB</span>
                </div>
            </div>
        </template>

        <!-- ======================================================== -->
        <!-- ESTADO B: ARCHIVO SELECCIONADO (Staging / Listo)         -->
        <!-- ======================================================== -->
        <template x-if="selectedFile">
            <div class="flex flex-col items-center justify-center gap-4 sm:gap-5 w-full max-w-2xl">
                <!-- Icono de Música con Check Verde Superior de Validación -->
                <div
                    class="relative w-18 h-18 sm:w-20 sm:h-20 rounded-xl bg-white border border-blue-300 flex items-center justify-center p-3.5 sm:p-4 shadow-2xs">
                    <img src="/assets/img/icons/music-file.svg" alt="Archivo seleccionado"
                        class="w-full h-full object-contain">

                    <!-- Check discreto en el top del icono (archivo cargado y validado) -->
                    <div class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center ring-2 ring-white shadow-2xs"
                        title="Canción cargada y validada">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                </div>

                <!-- Título del Archivo y Metadatos Homogéneos -->
                <div class="space-y-1.5 max-w-full px-2 text-center">
                    <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-slate-900 leading-tight tracking-tight truncate max-w-xs sm:max-w-md md:max-w-lg lg:max-w-xl mx-auto"
                        x-text="selectedFile ? selectedFile.name : ''"></p>

                    <!-- Formato y Tamaño en badges nítidos -->
                    <div class="flex items-center justify-center gap-2 text-xs sm:text-sm pt-0.5">
                        <span
                            class="px-2.5 py-0.5 rounded-md bg-white font-mono font-bold text-slate-700 border border-slate-300/80 shadow-2xs"
                            x-text="selectedFile ? selectedFile.extension : ''"></span>
                        <span class="text-slate-400 text-xs sm:text-sm pl-0.5">•</span>
                        <span class="font-mono text-slate-600 font-semibold text-xs sm:text-sm"
                            x-text="selectedFile ? selectedFile.sizeFormatted : ''"></span>
                    </div>
                </div>

                <!-- Botones de Acción Secundarios y Sobrios -->
                <div class="flex items-center justify-center gap-2.5 pt-1">
                    <!-- Cambiar Canción -->
                    <button type="button" @click.stop="triggerBrowse()"
                        class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-slate-300 hover:border-slate-400 bg-white hover:bg-slate-50 text-slate-700 font-bold text-xs sm:text-sm transition cursor-pointer shadow-2xs"
                        title="Seleccionar otra canción">
                        <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor"
                            stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>Cambiar canción</span>
                    </button>

                    <!-- Quitar Archivo -->
                    <button type="button" @click.stop="removeFile()"
                        class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50 font-semibold text-xs sm:text-sm transition cursor-pointer"
                        title="Quitar este archivo">
                        <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor"
                            stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        <span>Quitar</span>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- Banner de Validación / Error en el Cliente -->
    <div x-show="errorMessage" x-cloak
        class="w-full max-w-xl mx-auto rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 flex items-center justify-between gap-3 shadow-2xs text-rose-900 text-xs sm:text-sm">
        <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-rose-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span x-text="errorMessage" class="font-medium"></span>
        </div>
        <button type="button" @click="errorMessage = ''"
            class="text-rose-500 hover:text-rose-800 p-1 rounded-md transition cursor-pointer" title="Cerrar aviso">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
</div>

<!-- Tarjetas Informativas: Pistas que entregará la IA (4 Stems Reales de Demucs) -->
<div class="space-y-2 pt-0.5">
    <div class="flex items-center justify-between">
        <h2 class="text-xs sm:text-sm font-bold text-gray-700 tracking-tight flex items-center gap-1.5">
            <span>Pistas que obtendrás</span>
            <span class="text-[11px] text-gray-400 font-normal">(aisladas individualmente)</span>
        </h2>
    </div>

    <!-- Grid de 4 Stems — Contenedores tonales M3 con icono sobre color sólido -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3">

        <!-- 1. VOZ — Azul Cobalto -->
        <div
            class="group relative rounded-xl bg-blue-50 border border-blue-200 hover:bg-blue-100 hover:border-blue-300 shadow-sm hover:shadow-md py-4 px-3 sm:py-5 sm:px-4 min-h-[100px] sm:min-h-[115px] flex flex-col items-center justify-center gap-2 text-center transition-all duration-200 hover:-translate-y-0.5">
            <div
                class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="/assets/img/icons/voice-black.svg" alt="Icono de Voz"
                    class="w-8 h-8 object-contain filter invert" loading="lazy">
            </div>
            <div class="space-y-0.5">
                <span class="block text-sm sm:text-base font-bold text-gray-900 tracking-tight">Voz</span>
            </div>
        </div>

        <!-- 2. BATERÍA — Teal -->
        <div
            class="group relative rounded-xl bg-teal-50 border border-teal-200 hover:bg-teal-100 hover:border-teal-300 shadow-sm hover:shadow-md py-4 px-3 sm:py-5 sm:px-4 min-h-[100px] sm:min-h-[115px] flex flex-col items-center justify-center gap-2 text-center transition-all duration-200 hover:-translate-y-0.5">
            <div
                class="w-16 h-16 rounded-full bg-teal-600 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="/assets/img/icons/drums-black.svg" alt="Icono de Batería"
                    class="w-8 h-8 object-contain filter invert" loading="lazy">
            </div>
            <div class="space-y-0.5">
                <span class="block text-sm sm:text-base font-bold text-gray-900 tracking-tight">Batería</span>
            </div>
        </div>

        <!-- 3. BAJO — Púrpura -->
        <div
            class="group relative rounded-xl bg-purple-50 border border-purple-200 hover:bg-purple-100 hover:border-purple-300 shadow-sm hover:shadow-md py-4 px-3 sm:py-5 sm:px-4 min-h-[100px] sm:min-h-[115px] flex flex-col items-center justify-center gap-2 text-center transition-all duration-200 hover:-translate-y-0.5">
            <div
                class="w-16 h-16 rounded-full bg-purple-600 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="/assets/img/icons/bass-black.svg" alt="Icono de Bajo"
                    class="w-8 h-8 object-contain filter invert" loading="lazy">
            </div>
            <div class="space-y-0.5">
                <span class="block text-sm sm:text-base font-bold text-gray-900 tracking-tight">Bajo</span>
            </div>
        </div>

        <!-- 4. OTROS — Rose -->
        <div
            class="group relative rounded-xl bg-rose-50 border border-rose-200 hover:bg-rose-100 hover:border-rose-300 shadow-sm hover:shadow-md py-4 px-3 sm:py-5 sm:px-4 min-h-[100px] sm:min-h-[115px] flex flex-col items-center justify-center gap-2 text-center transition-all duration-200 hover:-translate-y-0.5">
            <div
                class="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="/assets/img/icons/piano-black.svg" alt="Icono de Otros"
                    class="w-8 h-8 object-contain filter invert" loading="lazy">
            </div>
            <div class="space-y-0.5">
                <span class="block text-sm sm:text-base font-bold text-gray-900 tracking-tight">Otros</span>
            </div>
        </div>

    </div>
</div>

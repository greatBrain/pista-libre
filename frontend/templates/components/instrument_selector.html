<!-- Tarjetas Informativas: Pistas que entregará la IA (4 Stems Reales de Demucs) -->
<div class="space-y-4 pt-6">
    <!-- Grid de 4 Stems — Contenedores tonales M3 con icono sobre color sólido -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3">

        <!-- 1. VOZ — Azul Cobalto -->
        <div
            class="group relative py-5 px-4 min-h-[85px] flex flex-col items-center justify-center gap-2 text-center ">
            <div
                class="w-16 h-16 shadow-md rounded-full bg-blue-600 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="/assets/img/icons/voice-black.svg" alt="Icono de Voz"
                    class="w-8 h-8 object-contain filter invert" loading="lazy">
            </div>
            <div class="space-y-0.5">
                <span class="block text-sm sm:text-base font-bold text-gray-700 tracking-tight">Voz</span>
            </div>
        </div>

        <!-- 2. BATERÍA — Teal -->
        <div
            class="group relative py-5 px-4 min-h-[85px] flex flex-col items-center justify-center gap-2 text-center ">
            <div
                class="w-16 h-16 shadow-md rounded-full bg-teal-600 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="/assets/img/icons/drums-black.svg" alt="Icono de Batería"
                    class="w-8 h-8 object-contain filter invert" loading="lazy">
            </div>
            <div class="space-y-0.5">
                <span class="block text-sm sm:text-base font-bold text-gray-900 tracking-tight">Batería</span>
            </div>
        </div>

        <!-- 3. BAJO — Púrpura -->
        <div
            class="group relative py-5 px-4 min-h-[85px] flex flex-col items-center justify-center gap-2 text-center ">
            <div
                class="w-16 h-16 shadow-md rounded-full bg-purple-600 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="/assets/img/icons/bass-black.svg" alt="Icono de Bajo"
                    class="w-8 h-8 object-contain filter invert" loading="lazy">
            </div>
            <div class="space-y-0.5">
                <span class="block text-sm sm:text-base font-bold text-gray-900 tracking-tight">Bajo</span>
            </div>
        </div>

        <!-- 4. OTROS — Rose -->
        <div
            class="group relative py-5 px-4 min-h-[85px] flex flex-col items-center justify-center gap-2 text-center ">
            <div
                class="w-16 h-16 shadow-md rounded-full bg-rose-600 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-200">
                <img src="/assets/img/icons/piano-black.svg" alt="Icono de Otros"
                    class="w-8 h-8 object-contain filter invert" loading="lazy">
            </div>
            <div class="space-y-0.5">
                <span class="block text-sm sm:text-base font-bold text-gray-900 tracking-tight">Otros</span>
            </div>
        </div>

    </div>
</div>

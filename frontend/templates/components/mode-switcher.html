<label for="theme-toggle"
    class="relative inline-flex h-8 w-16 shrink-0 cursor-pointer select-none items-center rounded-full"
    aria-label="Cambiar tema claro u oscuro">

    <input type="checkbox" id="theme-toggle" class="peer sr-only"
        onchange="document.documentElement.classList.toggle('dark', this.checked); localStorage.setItem('theme', this.checked ? 'dark' : 'light')" />

    <!-- Pista -->
    <span class="absolute inset-0 rounded-full border border-slate-200 bg-white shadow-md transition-colors duration-500 ease-in-out
        peer-checked:border-slate-700 peer-checked:bg-slate-800 peer-focus-visible:ring-2 peer-focus-visible:ring-brand-500"></span>

    <!-- Perilla deslizante -->
    <span class="absolute left-1 top-1 h-6 w-6 rounded-full bg-amber-100 shadow ring-1 ring-slate-900/5 transition-all duration-500 ease-in-out
        peer-checked:translate-x-8 peer-checked:bg-slate-950 peer-checked:ring-white/10"></span>

    <!-- Íconos -->
    <img src="/assets/img/icons/light-mode-icon.svg" alt=""
        class="absolute left-2 top-2 h-4 w-4 opacity-100 transition-all duration-500 ease-in-out peer-checked:rotate-90 peer-checked:opacity-40 peer-checked:invert" />
    <img src="/assets/img/icons/night-mode-icon.svg" alt=""
        class="absolute right-2 top-2 h-4 w-4 opacity-40 transition-all duration-500 ease-in-out peer-checked:opacity-100 peer-checked:invert" />

    <script>
        (function (t) {
            t.checked = localStorage.getItem('theme') === 'dark';
            document.documentElement.classList.toggle('dark', t.checked);
        })(document.getElementById('theme-toggle'));
    </script>
</label>

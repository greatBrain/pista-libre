<label for="theme-toggle"
    class="relative inline-flex items-center cursor-pointer 
    select-none bg-gray-900 dark:bg-gray-100 px-1.5 py-1.5 shadow-xl 
    rounded-full border border-slate-200/70 dark:border-slate-700 transition-colors duration-200"
    aria-label="Cambiar tema claro u oscuro">

    <input type="checkbox" id="theme-toggle" class="peer sr-only" />
    <span class="relative flex items-center justify-between w-14 h-8 px-1.5">
        <img src="../../assets/img/icons/light-mode-icon.svg" alt="Modo claro" 
            class="h-4 w-4 z-10 opacity-100 dark:opacity-40 transition-opacity" />
        <img src="../../assets/img/icons/night-mode-icon.svg" alt="Modo oscuro"
            class="h-4 w-4 z-10 opacity-100 dark:opacity-100 transition-opacity" />
        <span class="absolute left-0 top-0 w-8 h-8 rounded-full bg-white dark:bg-slate-900 shadow-md ring-1 ring-slate-900/5 dark:ring-white/10 transition-transform duration-200 ease-out translate-x-0 dark:translate-x-6"></span>
    </span>
</label>

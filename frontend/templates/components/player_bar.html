<!-- Barra de Controles de Reproducción / Master Transport Console -->
<div
    class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 pb-2.5 sm:pb-3 border-b border-slate-200/80">
    <!-- 1. Play / Pause + Reiniciar + Reloj de Tiempo -->
    <div class="flex items-center justify-between sm:justify-start gap-2.5 sm:gap-3.5">
        <div class="flex items-center gap-2 sm:gap-2.5">
            <!-- Botón Play / Pause Principal -->
            <button type="button" @click="togglePlay()" :disabled="isLoading"
                :class="isLoading ? 'opacity-60 cursor-wait bg-slate-400' : 'bg-sky-500 hover:bg-sky-600 active:scale-95 cursor-pointer shadow-md shadow-sky-500/25'"
                class="w-12 h-12 sm:w-13 sm:h-13 lg:w-14 lg:h-14 rounded-full text-white flex items-center justify-center transition-all shrink-0"
                :title="isLoading ? 'Cargando pistas de audio...' : (isPlaying ? 'Pausar ensayo (Espacio)' : 'Reproducir ensayo (Espacio)')">
                <svg x-show="isLoading" x-cloak class="w-5 h-5 animate-spin text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <svg x-show="!isLoading && !isPlaying" class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg x-show="!isLoading && isPlaying" x-cloak class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>

            <!-- Botón Reiniciar (Volver al inicio 0:00) -->
            <button type="button" @click="restart()"
                class="w-8 h-8 sm:w-8.5 sm:h-8.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition cursor-pointer"
                title="Volver al inicio (00:00)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z" />
                </svg>
            </button>
        </div>

        <!-- Reloj Digital de Tiempo (Tiempo actual / Tiempo total) -->
        <div
            class="flex items-baseline gap-1.5 font-mono bg-slate-100 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg border border-slate-200/80">
            <span class="text-base sm:text-lg lg:text-xl font-extrabold text-slate-800"
                x-text="currentTimeDisplay">00:00</span>
            <span class="text-xs text-slate-400 font-semibold">/</span>
            <span class="text-xs sm:text-sm text-slate-500 font-semibold" x-text="totalTimeDisplay">{{ song_info.duration }}</span>
        </div>
    </div>

    <!-- 2. Línea de Tiempo Scrubber Central (Permite adelantar/retroceder en la canción) -->
    <div class="flex-1 max-w-2xl mx-0 sm:mx-4 flex items-center gap-2">
        <input type="range" min="0" max="100" step="0.2" x-model="playbackProgress" @input="seekTo($event.target.value)"
            class="w-full cursor-pointer accent-sky-500 h-2 rounded-lg" title="Avanzar / retroceder en la canción">
    </div>

    <!-- 3. Volumen Máster y Reset de Canales -->
    <div class="flex items-center justify-between sm:justify-end gap-2.5 sm:gap-3 shrink-0">
        <!-- Control de Volumen Máster -->
        <div
            class="flex items-center gap-2 bg-slate-50 border border-slate-200/80 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg">
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500 shrink-0" fill="none" stroke="currentColor"
                stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.536 8.464a5 5 0 010 7.072M12 6l-4 4H4v4h4l4 4V6z" />
            </svg>
            <input type="range" min="0" max="100" x-model="masterVolume" @input="applyMixState()"
                class="w-20 sm:w-24 lg:w-28 accent-slate-800 cursor-pointer h-2">
            <span class="text-xs font-mono font-bold text-slate-600 w-9 text-right"
                x-text="masterVolume + '%'">85%</span>
        </div>

        <!-- Botón Resetear canales si hay Silencios o Solos activos -->
        <button type="button" @click="resetAllTracks()"
            class="px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg border border-slate-200/80 hover:bg-slate-100 text-slate-600 hover:text-slate-900 text-xs font-semibold transition cursor-pointer"
            title="Restablecer todos los canales a estado normal">
            Reset
        </button>
    </div>
</div>

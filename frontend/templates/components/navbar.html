<!-- Navbar Superior de Opciones (Desktop: barra horizontal fija | Mobile: header + aside desplegable) -->
<header class="sticky top-0 z-30 w-full bg-[#0B121E] border-b border-white/10">
    <div
        class="w-full max-w-[2160px] mx-auto px-4 sm:px-6 lg:px-10 xl:px-14 h-16 flex items-center justify-between relative">

        <!-- Izquierda: Brand / Nombre del Producto -->
        <div class="flex items-center">
            <a href="/" class="flex items-center gap-3 group shrink-0">
                <div
                    class="w-12 h-12 rounded-full bg-white border border-white/15 group-hover:border-amber-400/50 transition-colors duration-200 flex items-center justify-center p-1.5">
                    <img src="/assets/img/icons/music-symbol.svg" alt="Pista Libre logo"
                        class="w-full h-full object-contain">
                </div>
                <span
                    class="text-lg sm:text-xl font-semibold tracking-tight text-slate-100 group-hover:text-indigo-200 transition-colors">
                    Pista Libre
                </span>
            </a>
        </div>

        <!-- Centro: Navegación Principal (Desktop) -->
        <nav aria-label="Navegación principal"
            class="hidden lg:flex items-center gap-1.5 p-1 rounded-xl bg-[#111A2B] border border-white/10 absolute left-1/2 -translate-x-1/2">
            <!-- 1. Inicio -->
            <a href="/"
                class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm transition-all duration-150 {% if active_tab == 'home' %}font-semibold text-gray-900 bg-white/90 border border-gray-800/25{% else %}font-medium text-slate-400 hover:text-slate-100 hover:bg-white/[0.04] border border-transparent{% endif %}">
                <svg class="w-4 h-4 {% if active_tab == 'home' %}text-gray-900{% else %}text-slate-500{% endif %}"
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>Inicio</span>
            </a>

            <!-- 2. Sala de ensayo -->
            <a href="/practice"
                class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm transition-all duration-150 {% if active_tab == 'practice' %}font-semibold text-gray-900 bg-white/90 border border-gray-800/25{% else %}font-medium text-slate-400 hover:text-slate-100 hover:bg-white/[0.04] border border-transparent{% endif %}">
                <svg class="w-4 h-4 {% if active_tab == 'practice' %}text-gray-900{% else %}text-slate-500{% endif %}"
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span>Sala de ensayo</span>
            </a>
        </nav>

        <!-- Botón Hamburguesa para Móvil (< lg) -->
        <div class="lg:hidden flex items-center gap-2">
            <button type="button" @click="mobileMenuOpen = !mobileMenuOpen"
                class="p-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/[0.06] border border-white/10 transition focus:outline-none"
                aria-label="Abrir menú de navegación">
                <svg x-show="!mobileMenuOpen" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg x-show="mobileMenuOpen" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Menú Desplegable para Móviles (< lg) -->
    <div x-show="mobileMenuOpen" x-cloak @click.away="mobileMenuOpen = false"
        x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 -translate-y-1.5"
        x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-100"
        x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-1.5"
        class="lg:hidden border-b border-white/10 bg-[#111A2B] px-4 py-3 space-y-1.5">
        <a href="/"
            class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm {% if active_tab == 'home' %}font-semibold text-amber-300 bg-amber-400/10 border border-amber-400/25{% else %}font-medium text-slate-300 hover:text-white hover:bg-white/[0.05] border border-transparent{% endif %}">
            <svg class="w-4 h-4 {% if active_tab == 'home' %}text-amber-400{% else %}text-slate-400{% endif %}"
                fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span>Inicio</span>
        </a>

        <a href="/practice"
            class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm {% if active_tab == 'practice' %}font-semibold text-amber-300 bg-amber-400/10 border border-amber-400/25{% else %}font-medium text-slate-300 hover:text-white hover:bg-white/[0.05] border border-transparent{% endif %}">
            <svg class="w-4 h-4 {% if active_tab == 'practice' %}text-amber-400{% else %}text-slate-400{% endif %}"
                fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span>Sala de ensayo</span>
        </a>

        <a href="/#recientes" @click="mobileMenuOpen = false"
            class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-white/[0.05] border border-transparent">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Recientes</span>
        </a>
    </div>
</header>

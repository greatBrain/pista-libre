<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pista Libre{% endblock %}</title>

    <link rel="icon" href="/assets/img/icons/music-symbol.svg">

    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v3 vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#bae0fd',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                    },
                    boxShadow: {
                        'card': '0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.04)',
                    }
                }
            }
        }
    </script>

    <!-- Estilos externos desacoplados -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Howler.js: Motor de audio Web Audio API para salas multitrack -->
    <script defer src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
    <!-- Controlador cliente de Pista Libre -->
    <script defer src="/static/js/app.js"></script>
    <!-- Alpine.js: Interactividad ligera de UI local -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>

<body class="h-full font-sans bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-200 transition-colors duration-500 antialiased selection:bg-brand-100 selection:text-brand-700 flex flex-col"
    x-data="{ mobileMenuOpen: false }">

    <!-- Navbar superior horizontal en Desktop y cabecera móvil -->
    {% include "components/navbar.html" %}

    <!-- Contenedor del contenido principal centrado horizontalmente a pantalla completa -->
    <main class="flex-1 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- Barra inferior de reproducción flotante (centrada en pantalla completa) -->
    {% block footer %}{% endblock %}

</body>

</html>
